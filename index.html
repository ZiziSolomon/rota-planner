<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift rota planner v5</title>
<style>
:root {
  --bg: #faf8f5; --fg: #1e1b18; --muted: #6b625a; --line: #e2dbd2;
  --card: #ffffff; --accent: #3b6ea5; --good: #2f7a4d; --bad: #b3402f;
  --warn-bg: #fdf3e0; --warn-line: #e8c98a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16140f; --fg: #ece6dd; --muted: #9c9288; --line: #322d26;
    --card: #201d18; --accent: #7fa9d8; --good: #6bbb8a; --bad: #e0806e;
    --warn-bg: #2e2415; --warn-line: #6b552c;
  }
}
:root[data-theme="dark"] {
  --bg: #16140f; --fg: #ece6dd; --muted: #9c9288; --line: #322d26;
  --card: #201d18; --accent: #7fa9d8; --good: #6bbb8a; --bad: #e0806e;
  --warn-bg: #2e2415; --warn-line: #6b552c;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
header { padding: 20px 24px 8px; border-bottom: 1px solid var(--line); }
h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
/* Version badge: if this is not the newest number, you are on a cached copy. */
.ver { font-size: 12px; font-weight: 700; vertical-align: middle; margin-left: 4px;
       padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff;
       font-variant-numeric: tabular-nums; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 24px; padding: 20px 24px 60px; align-items: start; }
@media (max-width: 1000px) { main { grid-template-columns: minmax(0,1fr); } }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
button {
  font: inherit; padding: 7px 13px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
#run { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

.status { padding: 7px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; }
.status.working { color: var(--muted); }
.status.good { color: var(--good); }
.status.bad { color: var(--bad); }

#options { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.opt { padding: 5px 11px; font-size: 13px; }
.opt.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* the grid */
.gridwrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; min-width: 620px; }
table.grid th, table.grid td {
  border: 1px solid var(--line); padding: 5px 6px; vertical-align: middle; text-align: center;
}
table.grid th.rowhead { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; font-weight: 500; }
table.grid th.corner { border: none; }
.dayname { font-size: 11px; color: var(--muted); font-weight: 500; }
.daynum { font-size: 15px; font-weight: 600; }
table.grid td { cursor: pointer; }
table.grid td.off { background: repeating-linear-gradient(45deg, transparent, transparent 5px, var(--line) 5px, var(--line) 6px); cursor: default; }
table.grid td.night { background: color-mix(in srgb, var(--accent) 7%, transparent); }
table.grid tr.cookrow td { background: color-mix(in srgb, var(--good) 6%, transparent); }
table.grid td.pinned { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -2px; }
.people { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
.chip {
  display: inline-block; padding: 2px 7px; border-radius: 20px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.chip.empty { background: transparent !important; color: var(--muted) !important; font-weight: 400; }
.chip.locked { box-shadow: 0 0 0 2px var(--fg); }

/* rules */
#rules h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; }
.rule { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-bottom: 7px; background: var(--card); }
.rule.off { opacity: .55; }
.ruletop { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.ruletop input { margin-top: 3px; flex: none; }
.rid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700;
       background: var(--line); padding: 1px 5px; border-radius: 4px; flex: none; }
.rid.era-big { background: color-mix(in srgb, var(--accent) 25%, var(--line)); }
.rid.era-small { background: color-mix(in srgb, var(--good) 25%, var(--line)); }
.rtext { font-size: 13px; }
.vars { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0 26px; }
.var { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
.var select { font: inherit; font-size: 12px; padding: 3px 5px; border-radius: 5px;
              border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.rule .muted.small { margin: 5px 0 0 26px; }

/* diagnostics */
.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px;
        padding: 10px 12px; margin: 12px 0; font-size: 13px; }
.diagbox { background: var(--card); border: 1px solid var(--bad); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.diagbox h3 { margin: 0 0 8px; font-size: 15px; color: var(--bad); }
.misses { margin: 6px 0 12px; padding-left: 20px; font-size: 12.5px; color: var(--muted); }
.culprit { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.fixbtn { flex: none; font-size: 12px; padding: 4px 10px; }
.ctext { font-size: 13px; }

/* view switcher + the ported render.py views */
.viewswitch { display: flex; gap: 6px; margin-bottom: 14px; }
.viewswitch button { font-size: 13px; padding: 5px 12px; }
.viewswitch button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.legend .chip { padding: 4px 12px; border-radius: 999px; font-weight: 650; font-size: 13px; }
.minichip { display: inline-block; padding: 1px 7px; border-radius: 999px;
            font-size: 11px; font-weight: 650; margin: 0 2px 2px 0; }
.scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; }
.scroll table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 560px; }
.scroll th, .scroll td { padding: 6px 9px; text-align: left; white-space: nowrap; }
.scroll thead th { background: var(--card); font-size: 12px; border-bottom: 2px solid var(--line); }
.scroll thead th.who { text-align: center; }
.scroll tbody td, .scroll tbody th { border-bottom: 1px solid var(--line); }
.scroll tbody th { font-weight: 600; color: var(--muted); font-size: 12.5px; }
.scroll th.day { border-right: 1px solid var(--line); vertical-align: top;
                 font-weight: 700; color: var(--fg); }
.scroll .daynum { font-size: 16px; }
.scroll tr.day-start > * { border-top: 2px solid var(--line); }
.scroll td.cell { text-align: center; font-weight: 640; font-size: 12.5px;
                  border-left: 1px solid var(--line); height: 34px; }
.scroll td.editable { cursor: pointer; }
.scroll td.editable:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.scroll td.free { color: var(--muted); font-weight: 500; text-align: center;
                  background: color-mix(in srgb, var(--muted) 5%, transparent); }
.scroll td.freelist { font-size: 11.5px; white-space: normal; max-width: 220px; }
.scroll td.away { color: var(--muted); font-weight: 500; text-align: center;
   background: repeating-linear-gradient(45deg, transparent, transparent 5px, var(--line) 5px, var(--line) 10px); }
.split { display: flex; height: 100%; min-height: 26px; border-radius: 4px; overflow: hidden; }
.split span { flex: 1; display: flex; align-items: center; justify-content: center;
              font-size: 12px; font-weight: 650; padding: 2px 3px; }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
         margin-top: 16px; }
.cards .card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
                  letter-spacing: .05em; color: var(--muted); }
.cards .card table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cards .card td.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 8px; }
.cards .card th { font-weight: 600; text-align: left; font-size: 12.5px; }
.bar { display: inline-block; height: 9px; border-radius: 3px; background: var(--accent);
       vertical-align: middle; }
.note { color: var(--muted); font-size: 12px; margin: 9px 0 0; }

/* cell editor popover */
.pop { position: absolute; z-index: 50; background: var(--card); border: 1px solid var(--line);
       border-radius: 10px; padding: 11px; box-shadow: 0 8px 28px rgba(0,0,0,.28); width: 244px; }
.pophead { font-weight: 700; font-size: 13px; margin-bottom: 8px; }
.popbtn { width: 100%; font-size: 12.5px; margin-bottom: 7px; }
.popbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.poplabel { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
            color: var(--muted); font-weight: 700; margin-top: 4px; }
.pophint { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
.popppl { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.ppl { font-size: 11.5px; padding: 3px 8px; border-radius: 20px; }
.ppl.on { font-weight: 700; border-color: transparent; }

/* scores */
#scores { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; min-width: 175px; }
.card h4 { margin: 0 0 7px; font-size: 12px; color: var(--muted); font-weight: 600; }
table.mini { border-collapse: collapse; font-size: 13px; width: 100%; }
table.mini td { padding: 2px 0; }
table.mini td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
</style>
</head>
<body>
<header>
  <!-- The version is bumped with every push. If the number here is not the newest, you are
       looking at a cached copy - hard-reload with Ctrl+Shift+R. -->
  <h1>Shift rota planner <span class="ver">v5</span></h1>
  <p class="sub">A six-day childcare and cooking rota for six people, shown by initial.
     The solver runs entirely in your browser — nothing is sent anywhere, and the whole
     setup lives in the page URL, so a rota you like is a link you can keep.</p>
</header>

<main>
  <section>
    <div class="toolbar">
      <button id="run">Re-run the scheduler</button>
      <button id="clearlocks">Clear locks</button>
      <button id="reset">Reset to defaults</button>
      <button id="copy">Copy link</button>
      <button id="export">Export &amp; print</button>
      <span id="status" class="status">Starting…</span>
    </div>
    <div class="viewswitch">
      <button data-view="edit" class="on">Editable grid</button>
      <button data-view="day">By day</button>
      <button data-view="type">By person</button>
    </div>
    <div id="diag"></div>
    <div id="options"></div>
    <div class="gridwrap"><div id="grid"></div></div>
    <div id="scores"></div>
  </section>

  <aside>
    <div id="rules"></div>
  </aside>
</main>

<!-- ?v is bumped whenever the JS changes. Static file servers (and file:// itself) send no
     cache headers, so ES modules otherwise stay cached across reloads and you keep seeing
     an old page after an update. -->
<script type="module" src="./app.js?v=5"></script>
</body>
</html>
